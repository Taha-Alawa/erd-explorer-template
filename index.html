<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مستكشف المخطط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d1c1a;--muted:#6b6862;--b1:#dedbd4;--b2:#efede8;--bg:#f6f5f2;
  --side:380px;--head:92px;
  --green:oklch(0.58 0.12 150);--greenbg:oklch(0.965 0.03 150);
  --amber:oklch(0.62 0.12 70);--amberbg:oklch(0.97 0.035 85);--amberbd:oklch(0.78 0.12 75);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}

/* ---------- header ---------- */
header{position:fixed;top:0;left:0;right:var(--side);height:var(--head);padding:12px 24px;
  background:rgba(246,245,242,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--b1);
  display:flex;align-items:center;gap:20px;z-index:5}
.htxt{flex:1;min-width:0}
h1{margin:0;font-size:18px;font-weight:700;line-height:1.3}
.sub{margin-top:2px;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;flex-wrap:nowrap;gap:12px;margin-top:7px;font-size:11.5px;color:var(--muted);overflow-x:auto;scrollbar-width:none}
.legend::-webkit-scrollbar{display:none}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.lg-nf{font-family:var(--mono);font-size:10.5px;color:var(--green);background:var(--greenbg);box-shadow:inset 3px 0 0 var(--green);padding:1px 6px 1px 8px;border-radius:3px;direction:ltr}
.zoom{display:flex;gap:4px;direction:ltr;flex:none;align-items:center}
.zoom button{height:30px;min-width:30px;padding:0 10px;border:1px solid var(--b1);background:#fff;border-radius:6px;cursor:pointer;font-size:13px}
.zoom button:hover{border-color:#bdb8ae}
.zoom #zPct{min-width:58px;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.zoom .sep{width:1px;height:18px;background:var(--b1);margin:0 4px}

/* ---------- canvas ---------- */
#vp{position:fixed;top:var(--head);left:0;right:var(--side);bottom:0;overflow:hidden;direction:ltr;touch-action:none;cursor:grab;
  background-color:var(--bg);background-image:radial-gradient(circle,#d5d1c8 1px,transparent 1.3px);background-size:20px 20px}
#vp.panning,#vp.panning *{cursor:grabbing!important}
#vp.space,#vp.space *{cursor:grab!important}
#world{position:absolute;top:0;left:0;width:0;height:0;transform-origin:0 0}
body.busy{-webkit-user-select:none;user-select:none}
#lines{position:absolute;top:0;left:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#lines g{transition:opacity .18s}
#lines path{fill:none;stroke-width:1.3;vector-effect:non-scaling-stroke;transition:stroke .18s,stroke-width .18s}
#lines .n path{stroke:#6f6a61}#lines .n circle,#lines .n line{fill:#6f6a61;stroke:#6f6a61}
#lines .o path{stroke:#b3aea4}#lines .o circle,#lines .o line{fill:#b3aea4;stroke:#b3aea4}
#lines .d path{stroke-dasharray:4 4}
#lines line{stroke-width:2;vector-effect:non-scaling-stroke}
#lines.focusing g{opacity:.08}
#lines.focusing g.on{opacity:1}
#lines g.on path{stroke:var(--ink);stroke-width:2}
#lines g.on circle,#lines g.on line{fill:var(--ink);stroke:var(--ink)}

.card{position:absolute;width:320px;background:#fff;border-radius:8px;overflow:hidden;cursor:pointer;
  box-shadow:0 0 0 1px var(--b1),0 1px 2px rgba(0,0,0,.04);transition:opacity .18s,box-shadow .18s,transform .12s;direction:ltr;
  -webkit-user-select:none;user-select:none}
.card .bar{height:4px}
.ch{height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--b2);cursor:move}
.ch .en{font-family:var(--mono);font-weight:600;font-size:14px;white-space:nowrap}
.ch .pin{display:none;font-size:12px}
.card.pinned .ch .pin{display:inline}
.tag{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.05em;padding:2px 6px;border-radius:3px;flex:none}
.t-new{color:var(--green);background:var(--greenbg)}
.t-mod{color:var(--amber);background:var(--amberbg)}
.t-old{color:#8a867e;background:#f1efeb}
.ch .ar{margin-left:auto;direction:rtl;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card.old .ch .en{color:#8a867e}
.row{height:28px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--b2)}
.row .k{width:20px;flex:none;font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--muted)}
.row .fn{font-family:var(--mono);font-size:13px;white-space:nowrap}
.row .nt{flex:1;min-width:0;text-align:right;direction:rtl;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.nf{background:var(--greenbg);box-shadow:inset 3px 0 0 var(--green)}
.row.nf .k,.row.nf .fn{color:var(--green)}
.cf{height:30px;display:flex;align-items:center;padding:0 12px;background:#faf9f7;font-family:var(--mono);font-size:11px;color:#9a968e}
body.focusing .card.dim{opacity:.28}
.card.active{box-shadow:0 0 0 2px var(--ink),0 12px 30px rgba(0,0,0,.13);z-index:2}
.card.lifted{box-shadow:0 0 0 1px var(--b1),0 20px 44px rgba(0,0,0,.2);transform:scale(1.02);z-index:3;opacity:1!important}
.card.active.lifted{box-shadow:0 0 0 2px var(--ink),0 20px 44px rgba(0,0,0,.2)}

/* ---------- minimap ---------- */
#mini{position:absolute;left:16px;bottom:16px;padding:6px;background:rgba(255,255,255,.92);border:1px solid var(--b1);border-radius:8px;
  box-shadow:0 4px 14px rgba(0,0,0,.06);cursor:pointer;touch-action:none;z-index:4}
#mini canvas{display:block}

/* ---------- sidebar ---------- */
aside{position:fixed;top:0;right:0;bottom:0;width:var(--side);background:#fff;border-left:1px solid var(--b1);
  overflow-y:auto;padding:28px 26px 40px;z-index:6}
.x{position:absolute;top:18px;left:18px;width:30px;height:30px;border:1px solid var(--b1);background:#fff;border-radius:6px;cursor:pointer;font-size:13px}
.x:hover{border-color:#bdb8ae}
.eyebrow{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-weight:500}
.eyebrow i{width:9px;height:9px;border-radius:50%;display:inline-block}
.big{font-size:22px;margin:10px 0 8px;line-height:1.35}
.hint{color:var(--muted);font-size:14px;line-height:1.8;margin:0 0 18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:24px}
.stats div{border:1px solid var(--b2);border-radius:8px;padding:12px 14px}
.stats b{display:block;font-family:var(--mono);font-size:24px;font-weight:600}
.stats span{font-size:12.5px;color:var(--muted)}
.tn{font-family:var(--mono);font-size:22px;font-weight:600;margin:10px 0 2px;direction:ltr;text-align:right}
.tar{color:var(--muted);font-size:14px}
.tldr{font-size:16px;font-weight:500;line-height:1.7;margin:14px 0}
.ex{background:#f5f4f1;border-radius:8px;padding:12px 14px;font-size:13.5px;line-height:1.8;color:#3d3b37}
.ex b{display:block;font-size:11.5px;color:var(--muted);margin-bottom:2px;font-weight:600}
.sec{margin-top:24px}
.sec h3{font-size:12.5px;color:var(--muted);font-weight:600;margin:0 0 10px;letter-spacing:.01em}
.sec p{margin:0 0 8px;font-size:14px;line-height:1.85}
code.c{font-family:var(--mono);font-size:12px;background:#f1efeb;border-radius:4px;padding:1px 6px;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
code.g{color:var(--green);background:var(--greenbg)}
.adds{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.kl{list-style:none;margin:0;padding:0}
.kl li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--b2);font-size:13.5px;line-height:1.7}
.kl li:last-child{border-bottom:0}
.kl code{flex:none}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--b1);border-radius:999px;padding:3px 10px 3px 4px;font-size:12.5px}
.pill code{font-family:var(--mono);font-size:11px;color:var(--muted);background:#f5f4f1;border-radius:999px;padding:1px 7px;direction:ltr}
.rels{display:flex;flex-wrap:wrap;gap:6px}
.rc{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--b1);background:#fff;border-radius:6px;padding:4px 9px;cursor:pointer;direction:ltr}
.rc:hover{border-color:var(--ink)}
.rc i{width:8px;height:8px;border-radius:2px;display:inline-block}
.rc span{font-family:var(--mono);font-size:12.5px}
.rc em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.rule{margin-top:24px;background:var(--amberbg);border-right:3px solid var(--amberbd);border-radius:6px;padding:12px 14px;font-size:13.5px;line-height:1.85}
.rule b{display:block;font-size:12px;color:var(--amber);margin-bottom:2px}
.tips{list-style:none;margin:0;padding:0;font-size:13px;line-height:1.7;color:#3d3b37}
.tips li{padding:6px 0;border-bottom:1px solid var(--b2)}
.tips li:last-child{border-bottom:0}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--b1);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:#faf9f7;direction:ltr;unicode-bidi:isolate}

/* ---------- mobile ---------- */
@media (max-width:900px){
  :root{--head:84px}
  header{right:0;padding:10px 14px;gap:10px}
  h1{font-size:16px}
  #vp{right:0}
  #mini{display:none}
  #zReset,.zoom .sep{display:none}
  aside{top:auto;left:0;width:100%;height:46vh;border-left:0;border-top:1px solid var(--b1);border-radius:16px 16px 0 0;
    box-shadow:0 -10px 30px rgba(0,0,0,.12);transform:translateY(105%);transition:transform .25s ease;padding:22px 16px 32px}
  body.has-focus aside{transform:none}
  .zoom button{min-width:28px;height:28px;padding:0 8px}
}
</style>
</head>
<body>
<header>
  <div class="htxt">
    <h1 id="title"></h1>
    <div class="sub" id="sub"></div>
    <div class="legend" id="legend"></div>
  </div>
  <div class="zoom">
    <button id="zReset" title="إعادة ترتيب الجداول">↺</button>
    <span class="sep"></span>
    <button id="zOut" title="تصغير (−)">−</button>
    <button id="zPct" title="رجوع إلى 100%">100%</button>
    <button id="zIn" title="تكبير (+)">+</button>
    <button id="zFit" title="ملاءمة العرض (0)">ملاءمة</button>
  </div>
</header>
<div id="vp"><div id="world"><svg id="lines"></svg></div><div id="mini" title="الخريطة المصغّرة — اسحب لتحريك العرض"><canvas id="miniC"></canvas></div></div>
<aside id="side"></aside>

<script>
/* =====================================================================
   DATA — هذا هو الجزء الوحيد الذي تحتاج تغييره لمخططك
   ===================================================================== */

// معلومات الصفحة + نصوص الحالة الفارغة
const META = {
  project: 'متجر تجريبي · الاشتراكات والولاء',
  title: 'مخطط قاعدة البيانات — ميزة الاشتراكات ونقاط الولاء',
  hint: 'كل بطاقة جدول. الأخضر جديد، والصفوف الخضراء داخل جدول قديم حقول مضافة. اضغط على جدول لتثبيته، واضغط على مكان فارغ للرجوع.',
  idea: [
    'العميل يشترك في `Plan` فينشأ `Subscription` يولّد `Invoice` كل دورة، وتُدفع عبر `Payment`.',
    'كل `Order` مكتمل يضيف حركة في `PointTransactions`، والرصيد يُحسب منها لا يُخزَّن يدوياً.'
  ],
  rule: 'لا تحذف أي سجل مالي أو حركة نقاط — التصحيح يكون بسجل جديد معاكس.'
};

// المجموعات وألوانها
const G = {
  sub: { c: 'oklch(0.64 0.11 250)', ar: 'الاشتراكات' },
  pay: { c: 'oklch(0.64 0.11 155)', ar: 'المدفوعات' },
  loy: { c: 'oklch(0.72 0.12 75)',  ar: 'الولاء والنقاط' },
  ntf: { c: 'oklch(0.62 0.11 305)', ar: 'الإشعارات' },
  aud: { c: 'oklch(0.62 0.12 25)',  ar: 'التدقيق' },
  old: { c: '#c9c5bd',              ar: 'جدول قائم' }
};

const f = (name, type, key = '', note = '', isNew = false) => ({ name, type, key, note, isNew });

const T = {
  /* ---------- العمود 0: جداول قائمة ---------- */
  Users: {
    col: 0, group: 'old', isNew: false, mod: true, ar: 'المستخدمون',
    fields: [
      f('Id', 'bigint', 'PK'),
      f('Email', 'nvarchar(256)', 'UQ', 'البريد الإلكتروني'),
      f('FullName', 'nvarchar(120)', '', 'الاسم الكامل'),
      f('Phone', 'varchar(20)', '', 'رقم الجوال'),
      f('ReferralCode', 'varchar(12)', 'UQ', 'كود الإحالة', true),
      f('LoyaltyTier', 'tinyint', '', 'مستوى الولاء (نسخة للعرض)', true),
      f('MarketingOptIn', 'bit', '', 'موافقة على التسويق', true)
    ],
    tldr: 'المستخدم نفسه — أضفنا له كود إحالة ومستوى ولاء محفوظ للعرض السريع.',
    ex: 'سارة مسجّلة من سنة؛ الآن عندها `ReferralCode = SARA24` ومستواها فضي.',
    keys: [['Email', 'فريد، وهو معرّف الدخول.']],
    newKeys: [
      ['ReferralCode', 'كود فريد يشاركه المستخدم؛ يُولَّد مرة واحدة ولا يتغير.'],
      ['LoyaltyTier', 'نسخة من `LoyaltyAccounts.Tier` لتسريع العرض — المصدر الحقيقي هناك.'],
      ['MarketingOptIn', 'لازم يكون `1` قبل إرسال أي إشعار تسويقي.']
    ],
    rule: 'لا تعدّل `LoyaltyTier` يدوياً؛ يتحدّث تلقائياً عند تغيّر مستوى حساب الولاء.'
  },
  Products: {
    col: 0, group: 'old', isNew: false, mod: false, ar: 'المنتجات',
    fields: [
      f('Id', 'bigint', 'PK'),
      f('Sku', 'varchar(40)', 'UQ', 'رمز المنتج'),
      f('Name', 'nvarchar(200)', '', 'اسم المنتج'),
      f('Price', 'decimal(10,2)', '', 'السعر الحالي'),
      f('Stock', 'int', '', 'الكمية المتوفرة'),
      f('IsActive', 'bit', '', 'معروض للبيع؟')
    ],
    tldr: 'كتالوج المنتجات كما هو — ما تغيّر فيه شيء، لكن الاشتراكات صارت تشير إليه.',
    ex: 'كيس قهوة 1 كجم، `Sku = COF-1KG`، سعره 89.',
    keys: [['Sku', 'فريد، ويُستخدم في الربط مع المخزون.']]
  },
  Orders: {
    col: 0, group: 'old', isNew: false, mod: true, ar: 'الطلبات',
    fields: [
      f('Id', 'bigint', 'PK'),
      f('UserId', 'bigint', 'FK', 'صاحب الطلب'),
      f('Total', 'decimal(10,2)', '', 'الإجمالي'),
      f('Status', 'tinyint', '', 'حالة الطلب'),
      f('PlacedAt', 'datetime2', '', 'وقت الطلب'),
      f('SubscriptionId', 'bigint', 'FK', 'إن كان الطلب من اشتراك', true),
      f('PointsEarned', 'int', '', 'النقاط المكتسبة', true)
    ],
    tldr: 'الطلب نفسه — صار يعرف إذا كان جاي من اشتراك، وكم نقطة أعطى.',
    ex: 'طلب شهري تلقائي لقهوة: `SubscriptionId = 42` و`PointsEarned = 89`.',
    keys: [['UserId', 'صاحب الطلب.']],
    newKeys: [
      ['SubscriptionId', '`null` للطلبات العادية؛ قيمة للطلبات المولّدة من اشتراك.'],
      ['PointsEarned', 'تُحسب عند اكتمال الطلب فقط، وتنعكس كحركة `Earn`.']
    ],
    rule: 'لا تعطي نقاط لطلب ملغى أو مسترجع — راجع `Status` قبل إنشاء الحركة.'
  },

  /* ---------- العمود 1: الاشتراكات ---------- */
  Plans: {
    col: 1, group: 'sub', isNew: true, mod: false, ar: 'باقات الاشتراك',
    fields: [
      f('Id', 'bigint', 'PK'),
      f('Code', 'varchar(30)', 'UQ', 'رمز الباقة'),
      f('NameAr', 'nvarchar(80)', '', 'اسم الباقة'),
      f('Interval', 'tinyint', '', 'وحدة الدورة'),
      f('IntervalCount', 'int', '', 'كل كم وحدة'),
      f('Price', 'decimal(10,2)', '', 'سعر الدورة'),
      f('TrialDays', 'int', '', 'أيام التجربة')
    ],
    tldr: 'قالب الاشتراك: كل كم يتجدد وبكم.',
    ex: 'باقة «قهوة كل أسبوعين»: `Interval = Weekly` و`IntervalCount = 2`.',
    keys: [
      ['Code', 'ثابت ويُستخدم في الروابط والتقارير.'],
      ['IntervalCount', 'يُضرب في `Interval` لحساب الدورة.']
    ],
    enumName: 'BillingInterval',
    enums: [['Weekly', 'أسبوعي'], ['Monthly', 'شهري'], ['Yearly', 'سنوي']],
    rule: 'تغيير السعر لا يمس المشتركين الحاليين — أنشئ باقة جديدة.'
  },
  Subscriptions: {
    col: 1, group: 'sub', isNew: true, mod: false, ar: 'اشتراكات العملاء',
    fields: [
      f('Id', 'bigint', 'PK'),
      f('UserId', 'bigint', 'FK', 'المشترك'),
      f('PlanId', 'bigint', 'FK', 'الباقة'),
      f('PaymentMethodId', 'bigint', 'FK', 'وسيلة الدفع'),
      f('Status', 'tinyint', '', 'حالة الاشتراك'),
      f('CurrentPeriodEnd', 'datetime2', '', 'نهاية الدورة الحالية'),
      f('CancelAt', 'datetime2', '', 'موعد الإلغاء (اختياري)')
    ],
    tldr: 'اشتراك عميل محدد في باقة محددة — هو اللي يولّد الفواتير والطلبات.',
    ex: 'سارة مشتركة في «قهوة كل أسبوعين» من مارس، والدورة الحالية تنتهي 15 نوفمبر.',
    keys: [
      ['Status', 'يحدد هل نولّد فاتورة الدورة القادمة أم لا.'],
      ['CurrentPeriodEnd', 'عنده تُصدر الفاتورة التالية.'],
      ['CancelAt', 'إلغاء مؤجل لنهاية الدورة بدل الإلغاء الفوري.']
    ],
    enumName: 'SubscriptionStatus',
    enums: [['Trialing', 'تجريبي'], ['Active', 'نشط'], ['PastDue', 'متأخر الدفع'], ['Paused', 'موقوف مؤقتاً'], ['Canceled', 'ملغى']],
    rule: 'الانتقال لـ `PastDue` يكون فقط من فشل `Payment`، مو يدوياً.'
  },
  SubscriptionItems: {
    col: 1, group: 'sub', isNew: true, mod: false, ar: 'عناصر الاشتراك',
    fields: [
      f('Id', 'bigint', 'PK'),
      f('SubscriptionId', 'bigint', 'FK', 'الاشتراك'),
      f('ProductId', 'bigint', 'FK', 'المنتج'),
      f('Quantity', 'int', '', 'الكمية لكل دورة'),
      f('UnitPrice', 'decimal(10,2)', '', 'السعر المثبّت')
    ],
    tldr: 'وش يوصل للعميل في كل دورة.',
    ex: 'اشتراك سارة: كيسين `COF-1KG` بسعر 85 لكل كيس.',
    keys: [['UnitPrice', 'السعر وقت الاشتراك — لا يتغير مع تغير سعر المنتج.']]
  },

  /* ---------- العمود 2: المدفوعات ---------- */
  PaymentMethods: {

}

    const t = T[n];

    colY[t.col] = t._y + t._h + VG;

}
const LS_KEY = 'erd-layout:' + META.title;
function loadPos() {
  try { const o = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); return o && typeof o === 'object' ? o : null; }
  catch (e) { return null; }
}

    const p = saved[n];
    if (Array.isArray(p) && isFinite(p[0]) && isFinite(p[1])) { T[n]._x = +p[0]; T[n]._y = +p[1]; }
  }
  names.forEach(n => place(T[n]));
}
function bounds() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of names) {
    const t = T[n];
    x0 = Math.min(x0, t._x); y0 = Math.min(y0, t._y);
    x1 = Math.max(x1, t._x + W); y1 = Math.max(y1, t._y + t._h);

}

const NS = 'http://www.w3.org/2000/svg';

  g.dataset.a = c; g.dataset.b = p;

function redrawLines() {
  for (const L of LINES) {
    const A = T[L.c], B = T[L.p];
    const ay = A._y + (A._rows[L.cf] ?? A._row0), by = B._y + B._row0;

      const right = A._x + W <= B._x;          // الابن يسار الأب → من الحافة اليمنى للحافة اليسرى
      x1 = right ? A._x + W : A._x;
      x2 = right ? B._x : B._x + W;
      const off = Math.max(60, Math.abs(x2 - x1) * 0.45) * (right ? 1 : -1);

      x1 = A._x; x2 = B._x;

// ---- view: pan / zoom ----
function apply() {

  let g = 20 * view.s;

// wheel: عجلة الماوس / قرص التراكباد = تكبير، سحب بإصبعين = تحريك
vp.addEventListener('wheel', e => {
  e.preventDefault();
  stopAnim();
  userNav = true;
  const p = local(e);
  let dx = e.deltaX, dy = e.deltaY;
  if (e.deltaMode === 1) { dx *= 16; dy *= 16; }
  else if (e.deltaMode === 2) { dx *= vp.clientWidth; dy *= vp.clientHeight; }
  if (e.ctrlKey || e.metaKey) {                          // pinch (ctrl+wheel)
    const k = Math.abs(dy) < 50 ? 0.01 : 0.0015;
    return zoomAt(p.x, p.y, view.s * Math.exp(-dy * k));
  }
  const mouseWheel = e.deltaMode !== 0 || (e.deltaX === 0 && Math.abs(e.deltaY) >= 50 && Number.isInteger(e.deltaY));

  if (e.shiftKey && dx === 0) { dx = dy; dy = 0; }

  const [a, b] = [...pts.values()];
  const r = vp.getBoundingClientRect();
  gest = {
    mode: 'pinch', moved: true, v0: { ...view },
    d0: Math.hypot(a.x - b.x, a.y - b.y) || 1,
    m0: { x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top }
  };
  beginBusy();
}

vp.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0 && e.button !== 1) return;
  if (e.button === 1) e.preventDefault();
  stopAnim();
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { vp.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  if (pts.size === 2) return startPinch();
  if (pts.size > 2) return;
  const card = e.target.closest('.card');
  const header = e.target.closest('.ch');
  const mode = card && header && !spaceDown && e.button === 0 ? 'drag' : 'pan';
  gest = {
    mode, id: e.pointerId, sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY,
    moved: false, card: card ? card.dataset.t : null, clickable: !spaceDown && e.button === 0
  };
  if (mode === 'pan' && (!card || spaceDown || e.button === 1)) vp.classList.add('panning');
});

vp.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!gest) return;
  if (gest.mode === 'pinch') {
    if (pts.size < 2) return;
    const [a, b] = [...pts.values()], r = vp.getBoundingClientRect();
    const m = { x: (a.x + b.x) / 2 - r.left, y: (a.y + b.y) / 2 - r.top };
    const { v0, m0, d0 } = gest;
    const ns = clamp(v0.s * Math.hypot(a.x - b.x, a.y - b.y) / d0, MIN, MAX);
    const wx = (m0.x - v0.x) / v0.s, wy = (m0.y - v0.y) / v0.s;
    view.s = ns; view.x = m.x - wx * ns; view.y = m.y - wy * ns;
    userNav = true;
    return apply();
  }
  if (e.pointerId !== gest.id) return;
  if (!gest.moved) {
    if (Math.hypot(e.clientX - gest.sx, e.clientY - gest.sy) < CLICK_PX) return;
    gest.moved = true;
    userNav = true;
    beginBusy();
    if (gest.mode === 'pan') vp.classList.add('panning');
    else T[gest.card]._el.classList.add('lifted');
  }
  const dx = e.clientX - gest.lx, dy = e.clientY - gest.ly;
  gest.lx = e.clientX; gest.ly = e.clientY;
  if (gest.mode === 'pan') {
    view.x += dx; view.y += dy;
    apply();
  } else {
    const t = T[gest.card];
    t._x += dx / view.s; t._y += dy / view.s;
    place(t);
    queueLines();
  }
});

function pointerEnd(e) {
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if (!gest) return;
  if (gest.mode === 'pinch') {
    if (pts.size < 2) { gest = null; endBusy(e, false); }
    return;
  }
  if (e.pointerId !== gest.id) return;
  const g = gest;
  gest = null;
  if (!g.moved) {
    vp.classList.remove('panning');
    if (g.clickable && e.type === 'pointerup') tap(g.card, local(e));
    return;
  }
  if (g.mode === 'drag') { T[g.card]._el.classList.remove('lifted'); savePos(); }
  endBusy(e, true);
}
vp.addEventListener('pointerup', pointerEnd);
vp.addEventListener('pointercancel', pointerEnd);

// نقرة = تثبيت/إلغاء، نقرتان = تكبير على الجدول (أو تكبير خطوة على الفراغ)
function tap(n, p) {
  const now = performance.now();
  if (lastTap && now - lastTap.t < 320 && lastTap.n === n && Math.hypot(p.x - lastTap.x, p.y - lastTap.y) < 24) {
    lastTap = null;
    userNav = true;
    if (n) { pin(n); zoomToTable(n); }
    else animateTo(zoomTarget(p.x, p.y, view.s * 1.6), 240);
    return;
  }
  lastTap = { t: now, x: p.x, y: p.y, n };
  if (n) { if (pinned === n) reset(); else pin(n); }
  else if (pinned) reset();
}

// hover = وضع التركيز (معطّل أثناء السحب أو عند التثبيت)
world.addEventListener('mouseover', e => {
  if (busy || pinned) return;
  const c = e.target.closest('.card');
  if (c) focus(c.dataset.t);
});
world.addEventListener('mouseout', e => {
  if (busy || pinned) return;
  const c = e.target.closest('.card');
  if (c && !c.contains(e.relatedTarget)) reset();
});

// ---- keyboard ----
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (/INPUT|TEXTAREA|SELECT/.test(tag) || e.target.isContentEditable) return;
  if (e.key === 'Escape') return reset();
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === 'Space' || e.key === ' ') {
    if (tag === 'BUTTON') return;
    e.preventDefault();
    if (!spaceDown) { spaceDown = true; vp.classList.add('space'); }
    return;
  }
  const step = e.shiftKey ? 240 : 80;
  const pan = (dx, dy) => { stopAnim(); userNav = true; view.x += dx; view.y += dy; apply(); };
  switch (e.key) {
    case '+': case '=': zoomCenter(1.25); break;
    case '-': case '_': zoomCenter(1 / 1.25); break;
    case '0': userNav = true; fit(); break;
    case 'ArrowLeft': pan(step, 0); break;
    case 'ArrowRight': pan(-step, 0); break;
    case 'ArrowUp': pan(0, step); break;
    case 'ArrowDown': pan(0, -step); break;
    default: return;
  }
  e.preventDefault();
});
const spaceUp = () => { spaceDown = false; vp.classList.remove('space'); };
document.addEventListener('keyup', e => { if (e.code === 'Space' || e.key === ' ') spaceUp(); });
window.addEventListener('blur', spaceUp);

// ---- minimap ----
let mmB = null, mmK = 1, mmDrag = null, miniQ = 0;
function queueMini() { if (!miniQ) miniQ = requestAnimationFrame(() => { miniQ = 0; drawMini(); }); }
function mmBounds() { const b = bounds(), m = 160; return { x: b.x - m, y: b.y - m, w: b.w + 2 * m, h: b.h + 2 * m }; }
const vpWorld = () => ({ x: -view.x / view.s, y: -view.y / view.s, w: vp.clientWidth / view.s, h: vp.clientHeight / view.s });
function drawMini() {
  if (mini.offsetParent === null) return;
  const b = mmDrag && mmB ? mmB : (mmB = mmBounds());
  let k = 180 / b.w;
  if (b.h * k > 140) k = 140 / b.h;
  mmK = k;
  const cw = Math.round(b.w * k), ch = Math.round(b.h * k), dpr = window.devicePixelRatio || 1;
  if (miniC.width !== cw * dpr || miniC.height !== ch * dpr) {
    miniC.width = cw * dpr; miniC.height = ch * dpr;
    miniC.style.width = cw + 'px'; miniC.style.height = ch + 'px';
  }
  const c = miniC.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, cw, ch);
  const focusing = document.body.classList.contains('focusing');
  for (const n of names) {
    const t = T[n];
    c.globalAlpha = focusing && t._el.classList.contains('dim') ? 0.25 : 0.85;
    c.fillStyle = grp(t).c;
    c.fillRect((t._x - b.x) * k, (t._y - b.y) * k, W * k, t._h * k);
  }
  c.globalAlpha = 1;
  const r = vpWorld();
  c.fillStyle = 'rgba(29,28,26,.06)';
  c.strokeStyle = '#1d1c1a';
  c.lineWidth = 1.5;
  c.fillRect((r.x - b.x) * k, (r.y - b.y) * k, r.w * k, r.h * k);
  c.strokeRect((r.x - b.x) * k, (r.y - b.y) * k, r.w * k, r.h * k);
}
function mmWorld(e) {
  const rc = miniC.getBoundingClientRect();
  return { x: mmB.x + (e.clientX - rc.left) / mmK, y: mmB.y + (e.clientY - rc.top) / mmK };
}
function mmMove(p) { view.x = -(p.x - mmDrag.ox) * view.s; view.y = -(p.y - mmDrag.oy) * view.s; apply(); }
mini.addEventListener('pointerdown', e => {
  e.stopPropagation();
  e.preventDefault();
  stopAnim();
  userNav = true;
  try { mini.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  mmB = mmB || mmBounds();
  const p = mmWorld(e), r = vpWorld();
  const inside = p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
  mmDrag = inside ? { ox: p.x - r.x, oy: p.y - r.y } : { ox: r.w / 2, oy: r.h / 2 };
  mmMove(p);
});
mini.addEventListener('pointermove', e => { if (mmDrag) { e.stopPropagation(); mmMove(mmWorld(e)); } });
const mmEnd = e => { e.stopPropagation(); mmDrag = null; queueMini(); };
mini.addEventListener('pointerup', mmEnd);
mini.addEventListener('pointercancel', mmEnd);
window.addEventListener('resize', queueMini);

// ---- relations lookup ----
function relsOf(n) {
  const seen = new Set(), list = [];
  for (const [c, , p, type] of R) {
    const other = c === n ? p : p === n ? c : null;
    if (!other || !T[other]) continue;
    const key = other + type;
    if (seen.has(key)) continue;
    seen.add(key);
    list.push([other, type]);
  }
  return list;
}

// ---- focus / pin ----
function focus(n) {
  const rel = new Set(relsOf(n).map(x => x[0]));
  document.body.classList.add('focusing', 'has-focus');
  for (const k of names) {
    const el = T[k]._el;
    el.classList.toggle('dim', k !== n && !rel.has(k));
    el.classList.toggle('active', k === n);
    el.classList.toggle('pinned', k === pinned);
  }
  svg.classList.add('focusing');
  for (const L of LINES) L.g.classList.toggle('on', L.c === n || L.p === n);
  renderTable(n);
  queueMini();
}
function reset() {
  pinned = null;
  document.body.classList.remove('focusing', 'has-focus');
  for (const k of names) T[k]._el.classList.remove('dim', 'active', 'pinned');
  svg.classList.remove('focusing');
  for (const L of LINES) L.g.classList.remove('on');
  renderEmpty();
  queueMini();
}
function pin(n) { pinned = n; focus(n); }

side.addEventListener('click', e => {
  if (e.target.closest('.x')) return reset();
  const rc = e.target.closest('.rc');
  if (rc && T[rc.dataset.t]) {
    userNav = true;
    pin(rc.dataset.t);
    centerOn(rc.dataset.t, Math.max(view.s, 0.7));
  }
});

// ---- sidebar ----
const sec = (title, body) => `<div class="sec"><h3>${title}</h3>${body}</div>`;
const keyList = arr => `<ul class="kl">${arr.map(([k, v]) => `<li><code class="c">${esc(k)}</code><span>${fmt(v)}</span></li>`).join('')}</ul>`;
const TIPS = [
  'اسحب المساحة الفارغة لتحريك اللوحة — أو <kbd>Space</kbd> + سحب فوق أي مكان',
  'العجلة أو قرص التراكباد للتكبير نحو المؤشر، والسحب بإصبعين للتحريك',
  'اسحب رأس الجدول لنقله؛ زر <kbd>↺</kbd> يرجّع الترتيب الأصلي',
  'نقرتان على جدول للتكبير عليه',
  '<kbd>+</kbd> <kbd>−</kbd> تكبير وتصغير · <kbd>0</kbd> ملاءمة · الأسهم للتحريك · <kbd>Esc</kbd> إلغاء'
];

function renderEmpty() {
  const stats = [[S.newTables, 'جداول جديدة'], [S.modTables, 'جداول معدّلة'], [S.newFields, 'حقول جديدة'], [S.newEnums, 'حالات (Enums) جديدة']];
  side.innerHTML =
    `<div class="eyebrow">${esc(META.project)}</div>` +
    `<h2 class="big">مرّر أو اضغط على أي جدول</h2>` +
    `<p class="hint">${fmt(META.hint)}</p>` +
    `<div class="stats">${stats.map(([v, l]) => `<div><b>${esc(v)}</b><span>${l}</span></div>`).join('')}</div>` +
    sec('الفكرة كلها في سطرين', (META.idea || []).map(l => `<p>${fmt(l)}</p>`).join('')) +
    (META.rule ? `<div class="rule"><b>قاعدة مهمة</b>${fmt(META.rule)}</div>` : '') +
    sec('التنقل', `<ul class="tips">${TIPS.map(t => `<li>${t}</li>`).join('')}</ul>`);
  side.scrollTop = 0;
}

function renderTable(n) {
  const t = T[n], g = grp(t), s = st(t);
  const label = s === 'new' ? `جدول جديد · ${g.ar}` : s === 'mod' ? 'قائم · أُضيفت حقول' : 'قائم · بدون تغيير';
  let h =
    `<button class="x" aria-label="إغلاق" title="إغلاق">✕</button>` +
    `<div class="eyebrow"><i style="background:${esc(g.c)}"></i>${esc(label)}</div>` +
    `<h2 class="tn">${esc(n)}${pinned === n ? ' 📌' : ''}</h2>` +
    `<div class="tar">${esc(t.ar)}</div>`;
  if (t.tldr) h += `<p class="tldr">${fmt(t.tldr)}</p>`;
  if (t.ex) h += `<div class="ex"><b>مثال</b>${fmt(t.ex)}</div>`;
  if (s === 'mod') {
    const added = t.fields.filter(x => x.isNew);
    h += sec('ماذا أُضيف؟',
      `<div class="adds">${added.map(x => `<code class="c g">+ ${esc(x.name)}</code>`).join('')}</div>` +
      (t.newKeys?.length ? keyList(t.newKeys) : ''));
  }
  if (t.keys?.length) h += sec('حقول مهمة', keyList(t.keys));
  if (t.enumName && t.enums?.length) {
    h += sec(`الحالات · <code class="c">${esc(t.enumName)}</code>`,
      `<div class="pills">${t.enums.map(([k, ar, v], i) => `<span class="pill"><code>${esc(k)}=${esc(v ?? i + 1)}</code>${esc(ar)}</span>`).join('')}</div>`);
  }
  const rels = relsOf(n);
  if (rels.length) {
    h += sec('مرتبط بـ', `<div class="rels">${rels.map(([o, type]) =>
      `<button class="rc" data-t="${esc(o)}"><i style="background:${esc(grp(T[o]).c)}"></i><span>${esc(o)}</span><em>${esc(type)}</em></button>`).join('')}</div>`);
  }
  if (t.rule) h += `<div class="rule"><b>قاعدة مهمة</b>${fmt(t.rule)}</div>`;
  side.innerHTML = h;
  side.scrollTop = 0;
}

// ---- boot ----
measure();
layout();
redrawLines();
fit(false);
renderEmpty();
if (document.fonts?.ready) document.fonts.ready.then(() => {
  measure();
  if (!loadPos() && !(gest && gest.mode === 'drag')) { defaultLayout(); names.forEach(n => place(T[n])); }
  redrawLines();
  if (!userNav) fit(false); else queueMini();
});
</script>
</body>
</html>
